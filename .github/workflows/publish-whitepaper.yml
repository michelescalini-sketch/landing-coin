name: Publish LANDING whitepaper PDF

on:
  push:
    branches:
      - main
    paths:
      - 'LANDING-Whitepaper-v1.0.pdf.b64'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode PDF
        shell: bash
        run: |
          if [ ! -f LANDING-Whitepaper-v1.0.pdf.b64 ]; then
            echo "Source file already removed; nothing to do."
            exit 0
          fi
          base64 --decode LANDING-Whitepaper-v1.0.pdf.b64 > LANDING-Whitepaper-v1.0.pdf
          rm LANDING-Whitepaper-v1.0.pdf.b64

      - name: Commit PDF
        shell: bash
        run: |
          if [ ! -f LANDING-Whitepaper-v1.0.pdf ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LANDING-Whitepaper-v1.0.pdf LANDING-Whitepaper-v1.0.pdf.b64
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish LANDING Whitepaper v1.0 PDF"
          git push
